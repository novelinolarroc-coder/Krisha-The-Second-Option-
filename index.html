<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Three Doors</title>

<style>
/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(
            circle at 50% 35%,
            #25203a 0%,
            #100e1b 45%,
            #050509 100%
        );

    color: white;
}


/* =========================================================
   ATMOSPHERE
========================================================= */

.scene {
    position: fixed;
    inset: 0;

    overflow: hidden;
}


/* Vignette */

.scene::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,0.45) 70%,
            rgba(0,0,0,0.9) 100%
        );

    z-index: 10;
}


/* Background glow */

.glow {
    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 35%;

    transform: translate(-50%, -50%);

    background: rgba(130, 90, 255, 0.12);

    filter: blur(90px);

    border-radius: 50%;

    animation: breathe 5s ease-in-out infinite;
}

@keyframes breathe {

    0%,
    100% {
        opacity: 0.4;
        transform: translate(-50%, -50%) scale(0.9);
    }

    50% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1.15);
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particles {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 2;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    opacity: 0;

    animation: float 6s linear infinite;
}

.particle:nth-child(1) {
    left: 10%;
    top: 80%;
    animation-delay: 0s;
}

.particle:nth-child(2) {
    left: 20%;
    top: 60%;
    animation-delay: 1s;
}

.particle:nth-child(3) {
    left: 35%;
    top: 90%;
    animation-delay: 2s;
}

.particle:nth-child(4) {
    left: 50%;
    top: 70%;
    animation-delay: 3s;
}

.particle:nth-child(5) {
    left: 65%;
    top: 85%;
    animation-delay: 1.5s;
}

.particle:nth-child(6) {
    left: 80%;
    top: 65%;
    animation-delay: 4s;
}

.particle:nth-child(7) {
    left: 90%;
    top: 90%;
    animation-delay: 2.5s;
}

.particle:nth-child(8) {
    left: 45%;
    top: 50%;
    animation-delay: 3.5s;
}

@keyframes float {

    0% {
        transform: translateY(30px);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    80% {
        opacity: 0.5;
    }

    100% {
        transform: translateY(-180px);
        opacity: 0;
    }
}


/* =========================================================
   TITLE
========================================================= */

.title {
    position: absolute;

    top: 7%;
    left: 50%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 20;

    white-space: nowrap;

    transition: opacity 0.5s ease;
}

.title h1 {
    margin: 0;

    font-size: clamp(25px, 5vw, 55px);

    letter-spacing: 10px;

    font-weight: 300;

    text-shadow:
        0 0 10px rgba(255,255,255,0.4),
        0 0 30px rgba(150,100,255,0.3);
}

.title p {
    margin-top: 12px;

    font-size: 11px;

    letter-spacing: 5px;

    opacity: 0.45;
}


/* =========================================================
   DOOR AREA
========================================================= */

.door-area {
    position: absolute;

    left: 50%;
    top: 52%;

    transform: translate(-50%, -50%);

    display: flex;

    align-items: flex-end;

    justify-content: center;

    gap: clamp(12px, 3vw, 40px);

    z-index: 5;
}


/* Floor */

.floor {
    position: absolute;

    left: 50%;
    bottom: -45px;

    transform: translateX(-50%);

    width: 100vw;
    height: 120px;

    background:
        linear-gradient(
            to bottom,
            rgba(90,70,120,0.18),
            transparent
        );

    border-top: 1px solid rgba(255,255,255,0.08);

    filter: blur(1px);

    z-index: -1;
}


/* =========================================================
   DOOR
========================================================= */

.door-container {
    position: relative;

    width: clamp(95px, 17vw, 190px);
    height: clamp(210px, 40vw, 390px);

    cursor: pointer;

    transform-style: preserve-3d;

    perspective: 1000px;

    backface-visibility: hidden;

    transition:
        transform 0.5s ease,
        filter 0.5s ease,
        opacity 0.5s ease;
}


/* Hover — disabled once a door has been picked (zooming/open/fading) */

.door-container:hover:not(.zooming):not(.open):not(.fade-out) {
    transform:
        translateY(-12px)
        rotateX(2deg);

    filter:
        drop-shadow(
            0 20px 35px
            rgba(120,80,255,0.3)
        );
}


/* Tapped door zooms toward screen center */

.door-container.zooming {
    transform:
        translate(var(--dx, 0px), var(--dy, 0px))
        scale(var(--scale, 1));

    transition:
        transform 1s cubic-bezier(.22,.8,.22,1),
        filter 0.5s ease;

    filter:
        drop-shadow(
            0 30px 60px
            rgba(120,80,255,0.5)
        );

    will-change: transform;

    z-index: 50;
}


/* Other doors fade/shrink away when one is picked */

.door-container.fade-out {
    opacity: 0;

    transform: scale(0.85);

    pointer-events: none;
}


/* Door frame */

.frame {
    position: absolute;

    inset: -10px;

    border: 3px solid rgba(170,140,255,0.45);

    background:
        linear-gradient(
            90deg,
            #15121f,
            #33274b,
            #15121f
        );

    box-shadow:
        0 0 15px rgba(120,80,255,0.2),
        inset 0 0 20px rgba(0,0,0,0.8);

    z-index: 1;
}


/* Inner frame */

.frame::before {
    content: "";

    position: absolute;

    inset: 7px;

    border: 1px solid rgba(255,255,255,0.12);
}


/* Door itself */

.door {
    position: absolute;

    inset: 0;

    transform-origin: left center;

    transform-style: preserve-3d;

    background:
        linear-gradient(
            90deg,
            #24182e 0%,
            #493157 45%,
            #24182e 100%
        );

    border: 3px solid #80649e;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,0.8),
        0 15px 35px rgba(0,0,0,0.6);

    transition:
        transform 1.4s cubic-bezier(.2,.8,.2,1),
        box-shadow 1s ease;

    z-index: 2;
}


/* Door opens */

.door-container.open .door {
    transform: rotateY(-100deg);

    box-shadow:
        15px 0 35px rgba(0,0,0,0.8);
}


/* Door center line */

.door::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 8%;
    bottom: 8%;

    width: 1px;

    background: rgba(255,255,255,0.1);
}


/* =========================================================
   DOOR PANELS
========================================================= */

.panel {
    position: absolute;

    left: 12%;
    right: 12%;

    border: 2px solid rgba(180,150,220,0.45);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.03),
            rgba(0,0,0,0.3)
        );

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.3);
}

.panel.top {
    top: 9%;
    height: 31%;
}

.panel.bottom {
    bottom: 9%;
    height: 31%;
}


/* =========================================================
   DOOR LIGHT
========================================================= */

.door-light {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 45%;

    transform: translate(-50%, -50%);

    background: rgba(190,160,255,0.8);

    box-shadow:
        0 0 10px rgba(160,120,255,0.8),
        0 0 30px rgba(130,80,255,0.4);

    opacity: 0.3;

    transition: opacity 0.5s;
}

.door-container:hover .door-light,
.door-container.zooming .door-light,
.door-container.open .door-light {
    opacity: 1;
}


/* =========================================================
   HANDLE
========================================================= */

.handle {
    position: absolute;

    right: 9%;

    top: 50%;

    width: 12px;
    height: 12px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: #ddd;

    box-shadow:
        0 0 8px white,
        0 0 18px rgba(160,120,255,0.7);

    z-index: 5;
}


/* =========================================================
   LABELS
========================================================= */

.label {
    position: absolute;

    left: 50%;
    bottom: -48px;

    transform: translateX(-50%);

    text-align: center;

    width: 200px;

    pointer-events: none;

    transition: opacity 0.4s ease;
}

.door-container.zooming .label,
.door-container.open .label {
    opacity: 0;
}

.label strong {
    display: block;

    font-size: 12px;

    letter-spacing: 4px;

    font-weight: 400;

    opacity: 0.8;
}

.label span {
    display: block;

    margin-top: 6px;

    font-size: 8px;

    letter-spacing: 2px;

    opacity: 0.3;
}


/* =========================================================
   VIDEO SCREEN
========================================================= */

#videoScreen {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    opacity: 0;

    visibility: hidden;

    z-index: 99999;

    transition:
        opacity 2.5s cubic-bezier(.2,.8,.2,1);
}


/*
   IMPORTANT:
   2.5 SECOND FADE
*/

#videoScreen.show {
    opacity: 1;

    visibility: visible;
}


#myVideo {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: black;

    opacity: 0;

    transition:
        opacity 3s ease 0.5s;
}


#videoScreen.show #myVideo {
    opacity: 1;
}


/* Once playback ends, fade the video out to make room for the text */

#videoScreen.result #myVideo {
    opacity: 0;

    transition: opacity 1s ease;
}


/* =========================================================
   RESULT TEXT
========================================================= */

.result-text {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0 40px;

    text-align: center;

    font-size: clamp(18px, 4vw, 34px);

    font-weight: 300;

    letter-spacing: 6px;

    line-height: 1.6;

    opacity: 0;

    pointer-events: none;

    z-index: 100001;

    text-shadow:
        0 0 20px rgba(160,120,255,0.6),
        0 0 40px rgba(120,80,255,0.3);

    transition: opacity 1.2s ease;
}

.result-text.show {
    opacity: 1;
}


/* =========================================================
   LOADING TEXT
========================================================= */

.loading {
    position: absolute;

    left: 50%;
    bottom: 6%;

    transform: translateX(-50%);

    font-size: 9px;

    letter-spacing: 5px;

    opacity: 0.35;

    z-index: 100000;

    pointer-events: none;

    transition: opacity 1s;
}

#videoScreen.show .loading {
    opacity: 0;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .title {
        top: 5%;
    }

    .title h1 {
        letter-spacing: 5px;
    }

    .title p {
        letter-spacing: 3px;
    }

    .door-area {
        top: 52%;
        gap: 12px;
    }

    .door-container {
        width: 27vw;
        height: 58vw;
        max-height: 330px;
    }

    .label {
        bottom: -40px;
        width: 100px;
    }

    .label strong {
        font-size: 8px;
        letter-spacing: 2px;
    }

    .label span {
        font-size: 6px;
        letter-spacing: 1px;
    }

    .handle {
        width: 8px;
        height: 8px;
    }

    .frame {
        inset: -6px;
    }
}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }

}
</style>
</head>


<body>

<div class="scene">

    <div class="glow"></div>

    <!-- Floating particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>


    <!-- TITLE -->

    <div class="title" id="title">

        <h1>FORBIDDEN</h1>

        <p>DO NOT ENTER</p>

    </div>


    <!-- DOORS -->

    <div class="door-area">

        <div class="floor"></div>


        <!-- LEFT -->

        <div
            class="door-container"
            onclick="openDoor(this, 'Vid2.mp4')"
        >

            <div class="frame"></div>

            <div class="door">

                <div class="panel top"></div>

                <div class="panel bottom"></div>

                <div class="door-light"></div>

                <div class="handle"></div>

            </div>

            <div class="label">

                <strong>DOOR I</strong>

                <span>UNKNOWN</span>

            </div>

        </div>


        <!-- CENTER -->

        <div
            class="door-container"
            onclick="openDoor(this, 'Vid1.mp4')"
        >

            <div class="frame"></div>

            <div class="door">

                <div class="panel top"></div>

                <div class="panel bottom"></div>

                <div class="door-light"></div>

                <div class="handle"></div>

            </div>

            <div class="label">

                <strong>DOOR II</strong>

                <span>UNKNOWN</span>

            </div>

        </div>


        <!-- RIGHT -->

        <div
            class="door-container"
            onclick="openDoor(this, 'Vid3.mp4')"
        >

            <div class="frame"></div>

            <div class="door">

                <div class="panel top"></div>

                <div class="panel bottom"></div>

                <div class="door-light"></div>

                <div class="handle"></div>

            </div>

            <div class="label">

                <strong>DOOR III</strong>

                <span>UNKNOWN</span>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     VIDEO SCREEN
========================================================= -->

<div id="videoScreen">

    <video id="myVideo" playsinline>

        <source
            id="videoSource"
            src=""
            type="video/mp4"
        >

    </video>

    <div id="resultText" class="result-text">
        KRISHA THE SECOND OPTION
    </div>

    <div class="loading">
        LOADING
    </div>

</div>


<script>

const videoScreen =
    document.getElementById("videoScreen");

const video =
    document.getElementById("myVideo");

const videoSource =
    document.getElementById("videoSource");

const title =
    document.getElementById("title");

const resultText =
    document.getElementById("resultText");


let opening = false;


/* =========================================================
   OPEN DOOR
========================================================= */

function openDoor(door, videoFile) {

    if (opening) {
        return;
    }

    opening = true;


    /* Hide the title and fade out every other door */

    title.style.opacity = "0";

    document
        .querySelectorAll(".door-container")
        .forEach(other => {

            if (other !== door) {
                other.classList.add("fade-out");
            }

        });


    /*
       Compute how far the tapped door needs to
       move/scale to land in the center of the
       screen, so tapping it reads as "zooming in".
    */

    const rect = door.getBoundingClientRect();

    const doorCenterX = rect.left + rect.width / 2;
    const doorCenterY = rect.top + rect.height / 2;

    const viewportCenterX = window.innerWidth / 2;
    const viewportCenterY = window.innerHeight / 2;

    const dx = viewportCenterX - doorCenterX;
    const dy = viewportCenterY - doorCenterY;

    const scale = Math.min(
        (window.innerHeight * 0.85) / rect.height,
        (window.innerWidth * 0.75) / rect.width
    );

    door.style.setProperty("--dx", dx + "px");
    door.style.setProperty("--dy", dy + "px");
    door.style.setProperty("--scale", scale);

    door.classList.add("zooming");


    /*
       Let the zoom play for a beat, then swing
       the door open while it's front and center.
    */

    setTimeout(() => {

        door.classList.add("open");

    }, 550);


    /*
       Bring up the black video screen once the
       door has swung mostly open.
    */

    setTimeout(() => {

        /* Set video */

        videoSource.src = videoFile;

        video.load();

        video.currentTime = 0;


        /*
           Show black screen.

           The screen now takes
           2.5 seconds to fade in.
        */

        videoScreen.classList.add("show");


        /* Start video */

        video.play().catch(error => {

            console.log(
                "Video could not play:",
                error
            );

        });


        /* Browser fullscreen */

        try {

            if (videoScreen.requestFullscreen) {

                videoScreen.requestFullscreen();

            }

        } catch (error) {

            console.log(
                "Fullscreen unavailable."
            );

        }

    }, 1500);

}


/* =========================================================
   VIDEO ENDS
========================================================= */

video.addEventListener("ended", () => {

    /*
       Step 1 — fade the video out
       (the black screen stays up).
    */

    videoScreen.classList.add("result");


    /*
       Step 2 — once the video has
       mostly faded, fade the text in.
    */

    setTimeout(() => {

        resultText.classList.add("show");

    }, 900);


    /*
       Step 3 — hold on the text a moment,
       then fade it back out.
    */

    setTimeout(() => {

        resultText.classList.remove("show");

    }, 4200);


    /*
       Step 4 — fade the whole black
       screen away, revealing the doors.
    */

    setTimeout(() => {

        videoScreen.classList.remove("show");

    }, 5200);


    /*
       Step 5 — once that 2.5 second fade
       finishes, fully reset everything.
    */

    setTimeout(async () => {

        videoScreen.classList.remove("result");

        resultText.classList.remove("show");

        video.pause();

        video.currentTime = 0;

        videoSource.src = "";

        /*
           Reset doors and title back
           to their starting state.
        */

        document
            .querySelectorAll(".door-container")
            .forEach(door => {

                door.classList.remove(
                    "open",
                    "zooming",
                    "fade-out"
                );

                door.style.removeProperty("--dx");
                door.style.removeProperty("--dy");
                door.style.removeProperty("--scale");

            });

        title.style.opacity = "1";

        opening = false;


        /* Exit fullscreen only after the fade has finished */

        try {

            if (document.fullscreenElement) {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(
                "Could not exit fullscreen."
            );

        }

    }, 7700);

});

</script>

</body>
</html>
